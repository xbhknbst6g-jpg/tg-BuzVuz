<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <!-- Ограничение масштабирования для Web App и поддержка челки iPhone -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AI Видеостудия</title>
    <!-- Официальный скрипт Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* ГЛОБАЛЬНАЯ ИНТЕГРАЦИЯ С ТЕМАМИ TELEGRAM */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--tg-theme-secondary-bg-color, #f4f6f9); 
            margin: 0; padding: 15px; 
            padding-top: calc(env(safe-area-inset-top) + 15px);
            padding-bottom: calc(env(safe-area-inset-bottom) + 15px);
            color: var(--tg-theme-text-color, #333); 
            -webkit-user-select: none; user-select: none;
        }
        .header { text-align: center; margin-bottom: 25px; padding-top: 10px; }
        .header h1 { font-size: 22px; margin: 0 0 5px 0; color: var(--tg-theme-text-color, #111); }
        .header p { font-size: 14px; margin: 0; color: var(--tg-theme-hint-color, #666); }
        
        /* СЕТКА И КАРТОЧКИ ВЫБОРА РЕЖИМОВ ВИДЕО */
        .main-menu-grid { display: grid; grid-template-columns: 1fr; gap: 15px; margin-bottom: 20px; }
        .menu-card { 
            background: var(--tg-theme-bg-color, #fff); padding: 20px; border-radius: 12px; 
            border: 1px solid var(--tg-theme-border-color, #e1e6eb); box-shadow: 0 4px 6px rgba(0,0,0,0.02); 
            cursor: pointer; display: flex; align-items: center; gap: 15px; 
            transition: transform 0.1s ease, background-color 0.1s ease; -webkit-tap-highlight-color: transparent;
        }
        .menu-card:active { transform: scale(0.97); background-color: var(--tg-theme-secondary-bg-color, #fafafa); }
        .menu-icon { font-size: 32px; width: 45px; text-align: center; }
        .menu-info { display: flex; flex-direction: column; }
        .menu-title { font-weight: bold; font-size: 16px; color: var(--tg-theme-text-color, #000); margin-bottom: 2px; }
        .menu-desc { font-size: 13px; color: var(--tg-theme-hint-color, #777); line-height: 1.3; }

        .screen { display: none; }
        .screen.active { display: block; animation: fadeIn 0.2s ease-in-out; }
        
        /* Мобильная сетка шаблонов (2 колонки) */
        .phone-templates-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin: 15px 0; }
        .phone-template-card {
            position: relative; background: #000; border-radius: 12px; overflow: hidden;
            aspect-ratio: 3 / 4; box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            border: 1px solid var(--tg-theme-border-color, #e1e6eb); transition: transform 0.1s ease;
            cursor: pointer; -webkit-tap-highlight-color: transparent;
        }
        .phone-template-card:active { transform: scale(0.96); }
        .phone-template-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .phone-template-card .card-overlay {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.85)); 
            padding: 12px 8px 8px 8px; color: #fff; font-size: 11px; font-weight: 600; text-align: center; line-height: 1.3;
        }

        /* ИНТЕРФЕЙСНЫЕ КНОПКИ (ФОРМАТ И ДЛИТЕЛЬНОСТЬ) */
        .ratio-btn, .duration-btn { 
            -webkit-appearance: none; appearance: none; outline: none;
            border: 2px solid var(--tg-theme-border-color, #e1e6eb); border-radius: 8px; 
            background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #333); 
            cursor: pointer; font-weight: bold; text-align: center; transition: all 0.15s ease;
            -webkit-tap-highlight-color: transparent;
            flex: 1; padding: 12px;
        }
        .ratio-selector { display: flex; gap: 10px; margin: 0; }

        /* ПОДСВЕТКА АКТИВНЫХ КНОПОК */
        .ratio-btn.active, .duration-btn.active { 
            border-color: var(--tg-theme-button-color, #0088cc) !important; 
            background: rgba(0, 136, 204, 0.08) !important; 
            color: var(--tg-theme-button-color, #0088cc) !important; font-weight: bold !important;
        }
        
        .back-btn { 
            display: inline-block; padding: 8px 14px; background: var(--tg-theme-secondary-bg-color, #e1e6eb); 
            color: var(--tg-theme-text-color, #333); border-radius: 6px; font-size: 13px; font-weight: bold; 
            cursor: pointer; margin-bottom: 15px; border: none; -webkit-tap-highlight-color: transparent;
        }
        
        .submit-btn {
            width: 100%; padding: 15px; background: var(--tg-theme-button-color, #0088cc); 
            color: var(--tg-theme-button-text-color, white); border: none; border-radius: 12px; 
            font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 30px; -webkit-tap-highlight-color: transparent;
        }

        /* ПОЛНОЭКРАННЫЙ СТИЛЬНЫЙ МОБИЛЬНЫЙ ПЛЕЕР ПРЕВЬЮ */
        .video-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95); z-index: 2000; align-items: center; justify-content: center;
        }
        .video-modal-content { position: relative; width: 90%; max-width: 400px; aspect-ratio: 9 / 16; background: #000; border-radius: 12px; overflow: hidden; }
        .video-modal-content video { width: 100%; height: 100%; object-fit: cover; }
        .video-modal-close {
            position: absolute; top: 15px; right: 15px; width: 35px; height: 35px;
            background: rgba(255, 255, 255, 0.2); color: #fff; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 20px;
            font-weight: bold; cursor: pointer; z-index: 2100; backdrop-filter: blur(5px); border: none; line-height: 1;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: ГЛАВНОЕ МЕНЮ РАЗДЕЛА ВИДЕО (ИСПРАВЛЕНО: СРАЗУ ACTIVE) -->
    <div id="video_menu" class="screen active">
        <div class="header">
            <h1>Интеллектуальная AI Видеостудия</h1>
            <p>Выберите нужный инструмент для генерации видео</p>
        </div>
        
        <div class="main-menu-grid">
            <div class="menu-card" onclick="openScreen('animate_nosound')">
                <div class="menu-icon">🔇</div>
                <div class="menu-info">
                    <div class="menu-title">1. Оживление фото</div>
                    <div class="menu-desc">Анимация статичного кадра (без звука)</div>
                </div>
            </div>

            <div class="menu-card" onclick="openScreen('animate_sound')">
                <div class="menu-icon">🔊</div>
                <div class="menu-info">
                    <div class="menu-title">2. Оживление со звуком</div>
                    <div class="menu-desc">Говорящая фотография под аудиодорожку</div>
                </div>
            </div>
        </div>
    </div>
    <script>
        const tg = window.Telegram.WebApp;

        // Переменные настроек видео
        let currentActiveMode = 'video_menu';
        let currentAnimateRatio = '16:9';  
        let currentKlingDuration = 5;  

        // Инициализация WebApp при старте страницы
        window.addEventListener('DOMContentLoaded', () => {
            if (tg) {
                tg.ready();  
                tg.expand(); 
            }
            updateVideoMainButton(); // Сразу настраиваем видимость кнопки
        });

        // ====================================================================================
        // ЛАКОНИЧНЫЙ ОБНОВЛЯТОР ТЕКСТА ГЛАВНОЙ КНОПКИ ТЕЛЕГРАМ ДЛЯ ВИДЕО
        // ====================================================================================
        function updateVideoMainButton() {
            if (!tg || !tg.MainButton) return;
            
            // Если мы на главном меню видео — скрываем нативную кнопку
            if (currentActiveMode === 'video_menu') {
                tg.MainButton.hide();
                return;
            }

            let buttonText = "";
            let currentCallback = null;

            // Собираем текст для режима БЕЗ звука (показываем формат и выбранные секунды)
            if (currentActiveMode === 'animate_nosound') {
                buttonText = `${currentAnimateRatio} (${currentKlingDuration}s) Start ✨`;
                currentCallback = sendAnimateNoSoundData;
            } 
            // Собираем текст для режима СО звуком (формат там авто, пишем про звук)
            else if (currentActiveMode === 'animate_sound') {
                const audioToggle = document.getElementById("use_audio_toggle");
                const withAudio = audioToggle && audioToggle.checked ? "LipSync" : "No Audio";
                buttonText = `Auto (${withAudio}) Start ✨`;
                currentCallback = sendAnimateSoundData;
            }

            // Выводим лаконичную кнопку на экран шторки Telegram
            if (buttonText && currentCallback) {
                tg.MainButton.setText(buttonText);
                tg.MainButton.show();
                tg.MainButton.offClick(); // Очищаем старую память кликов
                tg.MainButton.onClick(currentCallback); // Вешаем чистую отправку
            }
        }

        // ИСПРАВЛЕНО: Заменили Python-слово 'def' на правильное JavaScript-слово 'function'!
        function openScreen(screenName) {
            currentActiveMode = screenName;
            const screens = ['video_menu', 'animate_nosound', 'animate_sound'];
            
            screens.forEach(s => {
                const el = document.getElementById(s);
                if (el) el.classList.remove('active');
            });
            
            const activeScreenEl = document.getElementById(screenName);
            if (activeScreenEl) {
                activeScreenEl.classList.add('active');
                updateVideoMainButton(); // Пересчитываем кнопку при смене экрана
            }
        }

        // Переключение формата видео (16:9 или 9:16)
        function setAnimateRatio(ratio, element) {
            if (!element) return;
            element.parentElement.querySelectorAll('.ratio-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            currentAnimateRatio = ratio;
            updateVideoMainButton(); // Мгновенно обновляем текст кнопки
        }

        // Переключение длительности видео (5 или 10 секунд)
        function setKlingDuration(duration, element) {
            if (!element) return;
            element.parentElement.querySelectorAll('.duration-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            currentKlingDuration = duration;
            updateVideoMainButton(); // Мгновенно обновляем текст кнопки
        }

        // Добавили триггер на чекбокс звука, чтобы текст кнопки менялся при снятии галочки
        window.addEventListener('load', () => {
            const toggle = document.getElementById("use_audio_toggle");
            if (toggle) {
                toggle.addEventListener('change', updateVideoMainButton);
            }
        });

        // Системный передатчик JSON-данных обратно в бота
        function sendToTelegram(payload) {
            try {
                if (tg && tg.sendData) {
                    tg.sendData(JSON.stringify(payload));
                    tg.close();
                }
            } catch (e) {
                console.error("Ошибка WebApp отправки:", e);
            }
        }

        // Сбор данных для анимации БЕЗ звука
        function sendAnimateNoSoundData() {
            sendToTelegram({
                mode_trigger: "video_menu",
                sub_mode: "animate_nosound",
                model_path: "fal-ai/kling-video/v2.1/standard/image-to-video",
                aspect_ratio: currentAnimateRatio,
                duration: currentKlingDuration,
                start_step: "request_photo" 
            });
        }

        // Сбор данных для анимации СО звуком
        function sendAnimateSoundData() {
            const audioToggle = document.getElementById("use_audio_toggle");
            const needAudioFile = audioToggle ? audioToggle.checked : false;
            sendToTelegram({
                mode_trigger: "video_menu",
                sub_mode: "animate_sound", 
                aspect_ratio: "auto",
                duration: 5, 
                with_audio: needAudioFile, 
                start_step: "request_photo"
            });
        }

        // Открытие полноэкранного плеера превью
        function openPreviewVideo(videoUrl) {
            if (!videoUrl || videoUrl.includes('ссылка_на_') || videoUrl === 'https://googleapis.com' || videoUrl === 'https://postimg.cc') {
                if (tg && tg.showAlert) tg.showAlert("Видео-пример еще загружается!");
                else alert("Видео-пример еще загружается!");
                return;
            }
            const modal = document.getElementById('videoPlayerModal');
            const player = document.getElementById('previewVideoPlayer');
            if (modal && player) {
                player.src = videoUrl;
                modal.style.display = 'flex';
                player.play().catch(e => console.log(e));
            }
        }

        // Закрытие плеера и очистка памяти
        function closePreviewVideo() {
            const modal = document.getElementById('videoPlayerModal');
            const player = document.getElementById('previewVideoPlayer');
            if (modal && player) {
                modal.style.display = 'none';
                player.pause();
                player.src = ""; 
            }
        }
    </script>
</body>
</html>
