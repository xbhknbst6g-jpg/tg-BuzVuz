<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Face Swap Templates</title>
    <!-- ИСПРАВЛЕНО: Правильный скрипт для Telegram Web App -->
    <script src="https://telegram.org"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="header">
        <h1>Выберите шаблон для Face Swap</h1>
        <p>Кликните на стиль, чтобы настроить генерацию</p>
    </div>

    <!-- Сетка шаблонов -->
    <div class="templates-grid">
        <!-- ИСПРАВЛЕНО: Везде возвращены точные прямые ссылки на картинки -->
        <div class="template-card" onclick="selectTemplate('girl_face', 'Лицо девушки')">
            <img src="https://postimg.cc" alt="Лицо_девушки">
            <div class="card-title">👩 Лицо девушки</div>
        </div>
        
        <div class="template-card" onclick="selectTemplate('Lying_down_phone', 'Лежа с телефоном')">
            <img src="https://postimg.cc" alt="Лежа_телефон">
            <div class="card-title">📱 Лежа с телефоном</div>
        </div>
        
        <div class="template-card" onclick="selectTemplate('catwoman', 'Женщина кошка')">
            <img src="https://postimg.cc" alt="Женщина_кошка">
            <div class="card-title">🐈 Женщина кошка</div>
        </div>
        
        <div class="template-card" onclick="selectTemplate('carousel_woman', 'Женщина карусель')">
            <img src="https://postimg.cc" alt="Женщина_карусель">
            <div class="card-title">🎠 Женщина карусель</div>
        </div>
        
        <div class="template-card" onclick="selectTemplate('demon_woman', 'Женщина демон')">
            <img src="https://postimg.cc" alt="Женщина_демон">
            <div class="card-title">😈 Женщина демон</div>
        </div>
        
        <div class="template-card" onclick="selectTemplate('woman_standing', 'Женщина стоит')">
            <img src="https://postimg.cc" alt="Женщина_стоит">
            <div class="card-title">🧍 Женщина стоит</div>
        </div>
    </div>

    <!-- Модальное окно (открывается при клике на фото) -->
    <div id="uploadModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 id="selectedStyleName">Настройка стиля</h2>
            
            <!-- Поле для промпта -->
            <div class="input-group">
                <label for="userPrompt">Ваш текстовый запрос (промпт):</label>
                <textarea id="userPrompt" placeholder="Например: сделать волосы рыжими, добавить неоновое свечение..."></textarea>
            </div>

            <!-- Квадратная зона для загрузки фото -->
            <p>Нажмите на квадрат ниже, чтобы загрузить свое селфи:</p>
            <label class="drop-zone" id="dropZone">
                <input type="file" id="userPhoto" accept="image/*" onchange="handlePhotoUpload(event)" style="display:none;">
                <div id="dropZoneText">
                    <span style="font-size: 40px;">📸</span><br>
                    Выбрать фото лица
                </div>
                <img id="photoPreview" src="" alt="Ваше фото" style="display:none;">
            </label>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let currentTemplateId = '';

        function selectTemplate(templateId, displayName) {
            currentTemplateId = templateId;
            document.getElementById('selectedStyleName').innerText = "Стиль: " + displayName;
            document.getElementById('uploadModal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('uploadModal').style.display = 'none';
            document.getElementById('photoPreview').style.display = 'none';
            document.getElementById('dropZoneText').style.display = 'block';
            document.getElementById('userPrompt').value = '';
            tg.MainButton.hide();
        }

        function handlePhotoUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById('photoPreview');
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    document.getElementById('dropZoneText').style.display = 'none';
                    
                    tg.MainButton.text = "Создать Face Swap ✨";
                    tg.MainButton.show();
                }
                reader.readAsDataURL(file);
            }
        }

        tg.onEvent('mainButtonClicked', function() {
            const fileInput = document.getElementById('userPhoto');
            const file = fileInput.files[0];
            const promptText = document.getElementById('userPrompt').value;

            if (!file) {
                alert('Пожалуйста, загрузите ваше фото!');
                return;
            }

            const reader = new FileReader();
            reader.onloadend = function() {
                const base64Data = reader.result;
                
                const dataToSend = {
                    template: currentTemplateId,
                    prompt: promptText,
                    photo: base64Data
                };

                tg.sendData(JSON.stringify(dataToSend)); 
                tg.close();
            }
            reader.readAsDataURL(file);
        });
    </script>
</body>
</html>
